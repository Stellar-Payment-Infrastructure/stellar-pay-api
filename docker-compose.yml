version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stellar_pay_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/stellar_pay_api
      - RPC_URL=https://soroban-testnet.stellar.org
      - NETWORK_PASSPHRASE=Test SDF Network ; September 2015
      - CONTRACT_ID=${CONTRACT_ID}
      - OPERATOR_SECRET_KEY=${OPERATOR_SECRET_KEY}
      - WEBHOOK_SECRET_PEPPER=${WEBHOOK_SECRET_PEPPER}
      - API_KEY_PREFIX=sk_test
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data: